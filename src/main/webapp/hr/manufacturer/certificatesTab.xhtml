<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:p="http://primefaces.org/ui"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"   
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"> 

    <p:toolbar style="margin-bottom: 1px;">
        <p:toolbarGroup align="left">
            <p:commandButton 
                value="New"
                icon="pi pi-plus" 
                actionListener="#{humanResourceManager.createNewManufacturerCertificate}"                                            
                process="@this"
                title="Add a new manufacturer certificate" >

                <p:ajax event="dialogReturn" 
                        listener="#{humanResourceManager.doManufacturerCertificateSearch}"
                        update="certificatesTable"/>

            </p:commandButton>
        </p:toolbarGroup>
    </p:toolbar> 

    <p:dataTable id="certificatesTable"
                 var="certificate"   
                 paginator="true"  
                 rows="15"
                 reflow="true"
                 paginatorTemplate="{FirstPageLink} {PreviousPageLink} {CurrentPageReport} {NextPageLink} {LastPageLink}"
                 value="#{humanResourceManager.selectedManufacturerCertifications}">

        <f:facet name="header">
            Certifications
        </f:facet>                      

        <p:column>
            <f:facet name="header">
                <h:outputText value="Number"/>
            </f:facet>
            <h:outputText value="#{certificate.number}" />
        </p:column>

        <p:column>
            <p:menuButton icon="pi pi-pencil" 
                          title="View or edit this certificate">

                <p:menuitem value="View/Edit"
                            actionListener="#{humanResourceManager.editSelectedCertification}"
                            icon="pi pi-pencil"       
                            title="View or edit certificate detail">  
                    
                    <p:ajax event="dialogReturn" 
                        listener="#{humanResourceManager.doManufacturerCertificateSearch}"
                        update="certificatesTable"/>

                    <f:setPropertyActionListener value="#{certificate}"
                                                 target="#{humanResourceManager.selectedCertification}" />

                </p:menuitem>

            </p:menuButton>    
        </p:column>

    </p:dataTable>

    <p:toolbar style="margin-top: 1px;">
        <p:toolbarGroup align="left">
            <p:commandButton 
                value="New"
                icon="pi pi-plus" 
                actionListener="#{humanResourceManager.createNewManufacturerCertificate}"                                            
                process="@this"
                title="Add a new manufacturer certificate" >

                <p:ajax event="dialogReturn" 
                        listener="#{humanResourceManager.doManufacturerCertificateSearch}"
                        update="certificatesTable"/>

            </p:commandButton>
        </p:toolbarGroup>
    </p:toolbar> 
</html>
