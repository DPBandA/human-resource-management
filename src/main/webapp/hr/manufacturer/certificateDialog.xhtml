<ui:composition 
    template="/jmts-ui/templates/jmts-dialog.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:p="http://primefaces.org/ui"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"   
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <ui:define name="head">
        <title>Certificate</title>
    </ui:define>

    <ui:define name="content">

        <ui:include src="../../common/commonDialogs.xhtml"/>  

        <h:form id="certificateForm" >

            <p:growl id="certificate_growl" life="5000" showDetail="true"/>

            <p:toolbar>
                <p:toolbarGroup>
                    <p:commandButton value="Ok"
                                     actionListener="#{humanResourceManager.okCertificate}"
                                     update="certificate_growl"                             
                                     icon="pi pi-check"/>
                    <p:spacer width="10"/>
                    <p:commandButton value="Cancel"
                                     immediate="true" 
                                     actionListener="#{humanResourceManager.cancelCertificateEdit}"
                                     icon="pi pi-times" />
                </p:toolbarGroup>

                <p:toolbarGroup align="right" >  
                    <h:outputText value="* Field required." style="font-weight: bold;" />            
                </p:toolbarGroup>
            </p:toolbar>

            <p:tabView id="certificateFormTabView"
                       dynamic="false"                       
                       style="margin-top: 1px;margin-bottom: 1px;"
                       widgetVar="certificateFormTabVar" >

                <p:tab id="certificateDetailsTab" title="General">

                    <h:panelGrid id="generalDetailsPanelGrid" columns="2" cellspacing="5" >

                        <p:outputLabel for="certificateActive" value="Active *" 
                                       style="font-weight: bold;" />  
                        <h:panelGroup>
                            <p:selectBooleanCheckbox style="vertical-align: middle"
                                                     id="certificateActive"
                                                     value="#{humanResourceManager.selectedCertification.active}" >

                                <p:ajax listener="#{humanResourceManager.updateCertification}"
                                        event="change"                                      
                                        process="@this"/>

                            </p:selectBooleanCheckbox>     

                            <p:tooltip for="certificateActive" 
                                       value="Check to activate this certificate" 
                                       showEffect="fade" hideEffect="fade" />            
                        </h:panelGroup>


                        <ui:remove>
                            <h:outputLabel for="jobNumber"
                                           value="Job number" />       
                            <p:inputText value="#{humanResourceManager.selectedCertification.number}"
                                         id="number" >

                                <p:ajax event="change"
                                        listener="#{humanResourceManager.updateCertification}"
                                        process="@this"/>

                            </p:inputText> 
                        </ui:remove>

                        <p:outputLabel value="Job number" 
                                       for="jobNumber" />   
                        <h:panelGroup>
                            <p:autoComplete value="#{humanResourceManager.selectedCertification.number}" 
                                            id="jobNumber"
                                            escape="false"
                                            maxResults="10"
                                            scrollHeight="200"
                                            forceSelection="false"
                                            completeMethod="#{jobManager.completeJobNumber}">

                                <p:ajax event="itemSelect"
                                        global="false"
                                        update="jobActionsMenu"
                                        listener="#{humanResourceManager.updateCertification}"
                                        process="@this"/>

                                <p:ajax event="keyup"
                                        update="jobActionsMenu"
                                        listener="#{humanResourceManager.updateCertification}"
                                        process="@this"/>

                            </p:autoComplete>
                            <p:menuButton id="jobActionsMenu" 
                                          icon="pi pi-pencil" 
                                          title="Add or edit job">
                                <p:menuitem value="Edit job"
                                            icon="pi pi-pencil" 
                                            disabled="${!humanResourceManager.selectedCertification.isJobNumberValid}"                              
                                            actionListener="#{humanResourceManager.editJob('Certificate')}"  
                                            update=":certificateForm:certificate_growl"
                                            process="@this,jobNumber"                             
                                            title="View or edit this job's detail">  

                                    <p:ajax event="dialogReturn" 
                                            listener="#{humanResourceManager.jobDialogReturn('Certificate')}"
                                            update=":certificateForm:certificate_growl,jobNumber,jobActionsMenu" />

                                </p:menuitem>

                                <p:menuitem 
                                    value="Add new job"
                                    icon="pi pi-plus" 
                                    actionListener="#{humanResourceManager.createNewJob}"                                            
                                    process="@this"
                                    title="Add a new job">

                                    <p:ajax event="dialogReturn" 
                                            listener="#{humanResourceManager.jobDialogReturn('Certificate')}"
                                            update=":certificateForm:certificate_growl,jobNumber,jobActionsMenu" />

                                </p:menuitem>
                            </p:menuButton>
                        </h:panelGroup>

                        <h:outputLabel for="certificateNumber" 
                                       value="Code/Number *" 
                                       style="font-weight: bold"/>
                        <p:inputText value="#{humanResourceManager.selectedCertification.certificateNumber}" 
                                     required="true"
                                     requiredMessage="Certification number is required"
                                     id="certificateNumber">

                            <p:ajax
                                listener="#{humanResourceManager.updateCertification}"
                                process="@this" />

                        </p:inputText>

                        <p:outputLabel value="Applicant *" style="font-weight: bold" />
                        <h:panelGroup>                
                            <p:autoComplete id="applicant"
                                            escape="false"
                                            var="applicant"
                                            itemLabel="#{applicant.truncatedName}"
                                            itemValue="#{applicant}"                    
                                            dropdown="false"
                                            scrollHeight="200" 
                                            value="#{humanResourceManager.selectedCertification.applicant}"  
                                            required="true"
                                            requiredMessage="Applicant required"
                                            forceSelection="true"
                                            cache="true"
                                            completeMethod="#{clientManager.completeActiveClient}" >

                                <f:converter converterId="clientConverter"/>

                                <f:attribute name="em" value="#{clientManager.entityManager1}"/>

                                <p:ajax event="itemSelect"
                                        global="false"
                                        listener="#{humanResourceManager.updateCertification}"
                                        process="@this"/>

                            </p:autoComplete>     

                            <p:menuButton id="applicantActionsMenu" 
                                          icon="pi pi-pencil" 
                                          title="Add or edit applicant">

                                <p:menuitem value="Edit applicant"
                                            id="editApplicant"
                                            icon="pi pi-pencil"
                                            disabled="${!humanResourceManager.isCertificateApplicantNameValid}"                                  
                                            actionListener="#{humanResourceManager.editCertificateApplicant}"  
                                            process="@this,applicant"                             
                                            title="View or edit this applicant's detail">  

                                    <p:ajax event="dialogReturn" 
                                            listener="#{humanResourceManager.certificateApplicantDialogReturn}"
                                            update="applicant,applicantActionsMenu" />

                                </p:menuitem>

                                <p:menuitem 
                                    value="Add new applicant"
                                    icon="pi pi-plus"  
                                    actionListener="#{humanResourceManager.createNewCertificateApplicant}"                                            
                                    process="@this"
                                    title="Add a new applicant">

                                    <p:ajax event="dialogReturn" 
                                            listener="#{humanResourceManager.certificateApplicantDialogReturn}"
                                            update="applicant,applicantActionsMenu" />

                                </p:menuitem>
                            </p:menuButton>      

                        </h:panelGroup>

                        <h:outputLabel for="dateIssued" 
                                       style="font-weight: bold"
                                       value="Date issued *" />
                        <p:calendar id="dateIssued"
                                    readonlyInput="true"
                                    required="true"
                                    requiredMessage="Date issued required"
                                    navigator="true" 
                                    pattern="MMM dd, yyyy" 
                                    value="#{humanResourceManager.selectedCertification.dateIssued}" >

                            <p:ajax event="dateSelect"
                                    listener="#{humanResourceManager.updateCertification}" />

                            <p:ajax event="keyup"
                                    listener="#{humanResourceManager.updateCertification}" />

                        </p:calendar>

                        <h:outputLabel for="expiryDate" 
                                       style="font-weight: bold"
                                       value="Expiry date *" />
                        <p:calendar id="expiryDate"
                                    readonlyInput="true"
                                    required="true"
                                    requiredMessage="Expiry date required"
                                    navigator="true" 
                                    pattern="MMM dd, yyyy" 
                                    value="#{humanResourceManager.selectedCertification.expiryDate}" >

                            <p:ajax event="dateSelect"
                                    listener="#{humanResourceManager.updateCertification}" />

                            <p:ajax event="keyup"
                                    listener="#{humanResourceManager.updateCertification}" />

                        </p:calendar>

                        <p:outputLabel for="notes" value="Notes" />   
                        <p:inputTextarea
                            value="#{humanResourceManager.selectedCertification.notes}"
                            id="notes"
                            maxlength="250"
                            autoResize="false"
                            rows="3"
                            style="width:100%" />

                    </h:panelGrid>   

                </p:tab>

            </p:tabView>
            
            <hr/>

            <h:panelGrid columns="3" 
                         id="certificateSignedPanelGrid"
                         cellpadding="5">

                <p:commandButton value="Sign"
                                 disabled="#{!humanResourceManager.user.can('SignManufacturerCertificate')}"
                                 title="Sign form"
                                 actionListener="#{humanResourceManager.updateManufacturerCertificateSigning}"
                                 update="certificateSignedPanelGrid"
                                 icon="pi pi-key"
                                 process="@this" />

                <h:outputText  value="#{humanResourceManager.selectedCertification.certificateSignedBy}" 
                               style="border: 1px!important;" />

                <h:outputText  value="#{humanResourceManager.selectedCertification.dateSigned}" 
                               style="border: 1px!important;" >

                    <f:convertDateTime pattern="MMM dd, yyyy" />

                </h:outputText>

            </h:panelGrid>

            <p:toolbar>
                <p:toolbarGroup>
                    <p:commandButton value="Ok"
                                     actionListener="#{humanResourceManager.okCertificate}"
                                     update="certificate_growl"                             
                                     icon="pi pi-check"/>
                    <p:spacer width="10"/>
                    <p:commandButton value="Cancel"
                                     immediate="true" 
                                     actionListener="#{humanResourceManager.cancelCertificateEdit}"
                                     icon="pi pi-times" />
                </p:toolbarGroup>

                <p:toolbarGroup align="right" >  
                    <h:outputText value="* Field required." style="font-weight: bold;" />            
                </p:toolbarGroup>
            </p:toolbar>

        </h:form> 

    </ui:define>
</ui:composition>
